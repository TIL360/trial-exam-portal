<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Marks Portal | Secure Gateway Login</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #ea580c;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
        }
        h2 {
            margin: 0 0 8px 0;
            color: var(--accent-orange);
            text-align: center;
            font-size: 1.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-light);
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }
        .btn-login {
            background: var(--accent-orange);
            color: #ffffff;
            font-weight: bold;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Cloud Marks Portal</h2>
    <div class="subtitle">Live verification infrastructure gate</div>
    
    <form id="cloudLoginForm">
        <div class="form-group">
            <label>Username / Institutional Email</label>
            <input type="text" id="usernameInput" required placeholder="Enter username or email">
        </div>
        <div class="form-group">
            <label>Security Password</label>
            <input type="password" id="passwordInput" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Verify Identity</button>
        <div class="error-box" id="errorWrapper"></div>
    </form>
</div>

<!-- 1. FIXED: Loaded the genuine Supabase CDN module package here -->
<script src="https://jsdelivr.net"></script>
<script>
    document.getElementById('cloudLoginForm').onsubmit = async (e) => {
        e.preventDefault(); // Stops native form submission reloads instantly!
        
        const inputVal = document.getElementById('usernameInput').value.trim();
        const passVal = document.getElementById('passwordInput').value;
        const errDiv = document.getElementById('errorWrapper');
        
        if (errDiv) errDiv.style.display = 'none';

        let supabaseClient;
        try {
            if (typeof supabase === 'undefined') {
                throw new Error("Supabase library failed to load from the web CDN. Please check your internet connection.");
            }
            const { createClient } = supabase;
            
            // 2. FIXED: Pointed request routes back to your active project engine address
            const supabaseUrl = 'https://vxdqfngvmrrupfooywwk.supabase.co'; 
            const supabaseKey = 'sb_publishable_dvggOmxQl7wmhpIrkzbrLw_9Zp-Dm57';
            
            supabaseClient = createClient(supabaseUrl, supabaseKey);
        } catch (initErr) {
            console.error("Initialization error:", initErr);
            if (errDiv) {
                errDiv.innerText = initErr.message;
                errDiv.style.display = 'block';
            }
            return;
        }

        const cleanEmail = inputVal.includes('@') ? inputVal : `${inputVal.toLowerCase()}@school.com`;

        try {
            console.log(`📡 Sending cloud verification request for user: ${cleanEmail}`);
            
            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: cleanEmail,
                password: passVal
            });

            if (authError) {
                console.warn("❌ Verification rejected:", authError.message);
                if (errDiv) {
                    errDiv.innerText = authError.message;
                    errDiv.style.display = 'block';
                }
                return;
            }

            const { data: profileData, error: profileError } = await supabaseClient
                .from('profiles')
                .select('role, assigned_class')
                .eq('id', authData.user.id)
                .single();

            if (profileError || !profileData) {
                if (errDiv) {
                    errDiv.innerText = "Authentication succeeded, but profile records are missing online.";
                    errDiv.style.display = 'block';
                }
                return;
            }

            // Save active user constraints to browser storage strings
            sessionStorage.setItem('cloud_user_uid', authData.user.id);
            sessionStorage.setItem('cloud_user_role', profileData.role);
            sessionStorage.setItem('cloud_user_class_scope', profileData.assigned_class || "");

            console.log(`✅ Success! Redirecting account to Marks-Portal.html`);

            // 3. FIXED: Routes to your marks portal filename directly
            window.location.href = 'Marks-Portal.html'; 
            
        } catch (catchErr) {
            console.error("Login process crash error stack:", catchErr);
            if (errDiv) {
                errDiv.innerText = "An unexpected error occurred during cloud login verification.";
                errDiv.style.display = 'block';
            }
        }
    };
</script>
</body>
</html>
