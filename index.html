<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Marks Portal</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--orange:#ea580c;--light:#f8fafc;--muted:#94a3b8;--border:#334155}
body{font-family:Segoe UI;background:var(--bg);color:var(--light);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.login-box{background:var(--card);padding:40px;border-radius:12px;width:100%;max-width:420px;border:1px solid var(--border)}
h2{color:var(--orange);text-align:center;margin:0 0 8px} .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:30px}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:.85rem;font-weight:600}
input{width:100%;padding:12px;background:#0f172a;border:1px solid var(--border);border-radius:6px;color:var(--light);box-sizing:border-box}
.btn{background:var(--orange);color:#fff;border:none;padding:14px;width:100%;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:15px}
.error{background:rgba(239,68,68,.1);border:1px solid #ef444433;color:#f87171;padding:10px;border-radius:6px;font-size:.85rem;text-align:center;margin-top:20px;display:none}
</style></head><body>
<div class="login-box">
<h2>CLOUD MARKS PORTAL</h2><div class="sub">Username & Password Only</div>
<form id="cloudLoginForm">
<label>Username</label><input id="usernameInput" required placeholder="uzma">
<label style="margin-top:20px">Password</label><input type="password" id="passwordInput" required placeholder="12345">
<button class="btn" type="submit" id="loginBtn">LOGIN</button>
<div class="error" id="errorWrapper"></div>
</form></div>

<script src="https://unpkg.com/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const supabaseUrl = 'https://vxdqfngvmrrupfooywwk.supabase.co'; 
const supabaseKey = 'sb_publishable_dvggOmxQl7wmhpIrkzbrLw_9Zp-Dm57';

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey, {
  auth: { persistSession: false }
});

document.getElementById('cloudLoginForm').onsubmit = async (e) => {
  e.preventDefault();
  const errDiv = document.getElementById('errorWrapper');
  const btn = document.getElementById('loginBtn');
  errDiv.style.display='none'; btn.textContent='Checking...'; btn.disabled=true;

  const username = document.getElementById('usernameInput').value.trim().toLowerCase();
  const password = document.getElementById('passwordInput').value.trim();

  try {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('username', username)
      .eq('password', password)
      .single();

    if (error || !data) throw new Error('Username ya Password ghalat hai');

    sessionStorage.setItem('cloud_user', data.username);
    sessionStorage.setItem('cloud_user_role', data.usertype);
    sessionStorage.setItem('cloud_user_class_scope', data.assigned_class || '');
    
    window.location.href = './Marks-Portal.html';
  } catch (err) {
    errDiv.textContent = err.message;
    if(err.message.includes('fetch')) errDiv.textContent = 'Failed to fetch - Full anon key paste karo aur mobile data pe try karo';
    errDiv.style.display='block';
    btn.textContent='LOGIN'; btn.disabled=false;
  }
};
</script>
</body></html>
