<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Marks Portal</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--orange:#ea580c;--light:#f8fafc;--muted:#94a3b8;--border:#334155}
body{font-family:'Segoe UI',system-ui;background:var(--bg);color:var(--light);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.login-box{background:var(--card);padding:40px;border-radius:12px;width:100%;max-width:420px;border:1px solid var(--border);box-shadow:0 10px 25px rgba(0,0,0,.3)}
h2{color:var(--orange);text-align:center;margin:0 0 8px;font-weight:800;text-transform:uppercase}
.subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:30px}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:.85rem;font-weight:600}
input{width:100%;padding:12px;background:#0f172a;border:1px solid var(--border);border-radius:6px;color:var(--light);box-sizing:border-box;font-size:.95rem}
input:focus{outline:none;border-color:var(--orange)}
.btn{background:var(--orange);color:#fff;border:none;padding:14px;width:100%;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:15px;text-transform:uppercase}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;padding:10px;border-radius:6px;font-size:.85rem;text-align:center;margin-top:20px;display:none;white-space:pre-wrap}
.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#4ade80;padding:10px;border-radius:6px;font-size:.85rem;text-align:center;margin-top:20px;display:none}
</style>
</head>
<body>
<div class="login-box">
<h2>Cloud Marks Portal</h2>
<div class="subtitle">Enter your username to verify</div>
<form id="cloudLoginForm">
<label>Username (e.g. Uzma)</label>
<input id="usernameInput" required placeholder="Uzma or Fozia" autocomplete="username">
<label style="margin-top:20px">Security Password</label>
<input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="current-password">
<button class="btn" id="loginBtn" type="submit">Verify Identity</button>
<div class="error" id="errorWrapper"></div>
<div class="success" id="successWrapper"></div>
</form>
</div>

<!-- FINAL CDN - Edge Tracking Prevention safe -->
<script src="https://unpkg.com/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const supabaseUrl = 'https://vxdqfngvmrrupfooywwk.supabase.co'; 
const supabaseKey = 'sb_publishable_dvggOmxQl7wmhpIrkzbrLw_9Zp-Dm57';

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

document.getElementById('cloudLoginForm').onsubmit = async (e) => {
  e.preventDefault();
  const errDiv = document.getElementById('errorWrapper');
  const sucDiv = document.getElementById('successWrapper');
  const btn = document.getElementById('loginBtn');
  errDiv.style.display='none'; sucDiv.style.display='none';
  btn.textContent='Verifying...'; btn.disabled=true;

  let rawInput = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  let lowerInput = rawInput.toLowerCase();

  try {
    // STEP A: profiles table se email nikalo username se
    console.log('Finding email for username:', lowerInput);
    let emailToUse = null;

    // Agar user ne email hi likh diya to direct use karo
    if (lowerInput.includes('@')) {
      emailToUse = lowerInput;
    } else {
      // username se email dhoondo
      const { data: profileRow, error: profileError } = await supabaseClient
        .from('profiles')
        .select('email, full_name, assigned_class, role, username')
        .or(`username.eq.${lowerInput},full_name.ilike.${lowerInput}`)
        .single();

      console.log('Profile found:', profileRow, 'Error:', profileError);

      if (profileError || !profileRow) {
        throw new Error(`Username "${rawInput}" profile table mein nahi mila. Pehle SQL Step 1 run karo.`);
      }
      if (!profileRow.email) {
        throw new Error(`Profile mila lekin email nahi hai. SQL se email update karo.`);
      }
      emailToUse = profileRow.email;
      
      // Session mein save karo
      sessionStorage.setItem('cloud_user_name', profileRow.full_name);
      sessionStorage.setItem('cloud_user_class_scope', profileRow.assigned_class || '');
      sessionStorage.setItem('cloud_user_role', profileRow.role || 'teacher');
    }

    console.log('Final email for auth:', emailToUse);

    // STEP B: Auth se password verify karo (Secure)
    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
      email: emailToUse,
      password: password
    });

    if (authError) throw authError;

    console.log('Auth OK:', authData.user.id);
    sucDiv.textContent = `Welcome ${rawInput}! Redirecting...`;
    sucDiv.style.display='block';
    sessionStorage.setItem('cloud_user_id', authData.user.id);
    sessionStorage.setItem('cloud_user_email', emailToUse);

    // Redirect
    setTimeout(() => { window.location.href = './Marks-Portal.html'; }, 500);

  } catch (err) {
    console.error(err);
    let msg = err.message;
    if (msg.includes('Failed to fetch') || msg.includes('fetch')) {
      msg += '\n\nReasons:\n1. Anon key adhi hai (... nahi chalega full paste karo)\n2. PTCL Supabase block - Mobile data / WARP VPN ON karo\n3. Project URL ghalat hai';
    }
    if (msg.includes('Invalid login credentials')) {
      msg = `Password ghalat hai ${rawInput} ke liye.\nAuth Users mein password reset karo.`;
    }
    errDiv.textContent = msg;
    errDiv.style.display='block';
    btn.textContent='Verify Identity'; btn.disabled=false;
  }
};
</script>
</body>
</html>
