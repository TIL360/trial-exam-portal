<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management - Portal Login</title>
    <!-- 1. Load the official Supabase library bundle for web browsers -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --background: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 1.5rem; font-size: 1.75rem; text-align: center; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn:hover { background: #4338ca; }
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Portal Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username / Email</label>
            <input type="text" id="username" placeholder="Enter your username or email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Log In</button>
        <div id="errorLog" class="error-message"></div>
    </form>
</div>

<script>
    // 2. Initialize Supabase client directly using the global browser object
    const supabaseUrl = 'https://supabase.co'; 
    const supabaseKey = 'sb_publishable_dvggOmxQl7wmhpIrkzbrLw_9Zp-Dm57';
    
    // Connect using window.supabase bundle loaded via CDN
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const userVal = document.getElementById('username').value.trim();
        const passVal = document.getElementById('password').value;
        const errorLog = document.getElementById('errorLog');
        
        errorLog.style.display = 'none';
        errorLog.innerText = '';

        // Standard text fallback string parser (e.g., "Uzma" becomes "uzma@school.com")
        const cleanEmail = userVal.includes('@') ? userVal : `${userVal.toLowerCase()}@school.com`;

        try {
            // 3. Query your custom 'profiles' table directly in the public schema
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', cleanEmail)
                .eq('password', passVal) // Direct plain-text matching comparison
                .maybeSingle(); // Gracefully handles 0 records found without throwing an exception

            if (error) {
                showError(`Database connectivity error: ${error.message}`);
                return;
            }

            if (!data) {
                showError("Invalid username or password. Access Denied.");
                return;
            }

            // Authentication clear: Proceed to dashboard app logic
            handleLoginSuccess(data);

        } catch (err) {
            showError(`Network connection dropped: ${err.message}`);
        }
    });

    function handleLoginSuccess(userProfile) {
        console.log(`✅ Access Granted:`, userProfile);
        alert(`Welcome back, ${userProfile.username}! Login Successful.`);
        
        // Save profile properties to browser session storage if you need them later
        sessionStorage.setItem('userRole', userProfile.usertype);
        sessionStorage.setItem('userScope', userProfile.assigned_class);
        
        // Uncomment this line to redirect to your main landing layout path:
        // window.location.href = 'dashboard.html';
    }

    function showError(message) {
        const errorLog = document.getElementById('errorLog');
        errorLog.innerText = message;
        errorLog.style.display = 'block';
    }
</script>

</body>
</html>
