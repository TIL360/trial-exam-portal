<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Marks Entry Portal</title>
    <style>
        :root { --primary:#00b074; --primary-hover:#008a5b; --bg:#1c1c1c; --surface:#2e2e2e; --text:#f3f4f6; --border:#444; }
        body{font-family:sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
        .container{max-width:1100px;margin:0 auto;background:var(--surface);padding:25px;border-radius:8px}
        h2{margin-top:0;color:var(--primary);border-bottom:2px solid var(--border);padding-bottom:10px}
        .filter-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr)) auto;gap:15px;background:rgba(0,0,0,0.2);padding:15px;border-radius:6px;align-items:flex-end;margin-bottom:25px}
        .form-group{display:flex;flex-direction:column;gap:5px} .form-group label{font-size:0.85rem;font-weight:600;color:#aaa}
        .form-control{padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:#111;color:white}
        .btn{background:var(--primary);color:white;border:none;padding:9px 20px;border-radius:4px;cursor:pointer;font-weight:600;height:38px}
        .btn:hover{background:var(--primary-hover)}
        table{width:100%;border-collapse:collapse} th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left} th{background:#222;color:var(--primary)}
        .input-score{width:80px;padding:6px;border:1px solid var(--border);border-radius:4px;text-align:center;font-weight:bold;background:#111;color:#fff}
        .footer-actions{margin-top:25px;display:flex;justify-content:flex-end;gap:15px;border-top:2px solid var(--border);padding-top:15px}
        .status-msg{display:inline-block;margin-right:auto;font-weight:600} .text-success{color:#00b074} .text-error{color:#ff4d4d}
        .offline-text{color:#aaa}
    </style>
    <!-- CORRECT CDN - WORKING -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="container">
    <h2>⚡ Cloud Marks Entry Portal (Supabase)</h2>
    <div class="filter-card">
        <div class="form-group"><label>Select Examination</label><select id="selectExam" class="form-control"><option value="">-- Choose Exam --</option></select></div>
        <div class="form-group"><label>Select Class</label><select id="selectClass" class="form-control"><option value="">-- Choose Class --</option></select></div>
        <div class="form-group"><label>Select Subject</label><select id="selectSubject" class="form-control"><option value="">-- Choose Subject --</option></select></div>
        <button type="button" id="btnFetch" class="btn">Fetch Student List</button>
    </div>
    <div class="table-responsive">
        <table id="marksTable" style="display:none;">
            <thead>
                <tr>
                    <th>Reg. No</th>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Father's Name</th>
                    <th>Offline Marks</th>
                    <th>Online Marks</th>
                </tr>
            </thead>
            <tbody id="studentListRows"></tbody>
        </table>
    </div>
    <div class="footer-actions" id="actionFooter" style="display:none;"><span id="statusMessage" class="status-msg"></span><button type="button" id="btnSave" class="btn">Save to Supabase</button></div>
</div>

<script>
    const supabaseUrl = 'https://vxdqfngvmrrupfooywwk.supabase.co'; 
    const supabaseKey = 'sb_publishable_dvggOmxQl7wmhpIrkzbrLw_9Zp-Dm57';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.addEventListener('DOMContentLoaded', () => {
        loadCloudDropdowns();
        document.getElementById('btnFetch').addEventListener('click', fetchCloudRows);
        document.getElementById('btnSave').addEventListener('click', saveCloudRows);
    });

    async function loadCloudDropdowns() {
        try {
            const { data: exams, error: e1 } = await supabaseClient.from('exams').select('id, exam_name').eq('school_code', 'TECHINFO_2026');
            const { data: classes, error: e2 } = await supabaseClient.from('classes').select('class_name, school_code').eq('school_code', 'TECHINFO_2026');
            const { data: subjects, error: e3 } = await supabaseClient.from('academy_subjects').select('subject_code, subject_display_name');
            
            const examSel = document.getElementById('selectExam') || document.getElementById('selectExamination');
            if (exams && examSel) exams.forEach(e => examSel.add(new Option(e.exam_name, e.id)));
            
            const classSel = document.getElementById('selectClass');
            if (classes && classSel) classes.forEach(c => classSel.add(new Option(c.class_name, c.class_name)));
            
            const subSel = document.getElementById('selectSubject');
            if (subjects && subSel) subjects.forEach(s => subSel.add(new Option(s.subject_display_name, s.subject_code)));
        } catch (err) {
            console.error("Dropdown loading failed:", err);
        }
    }

    async function fetchCloudRows() {
        const examSel = document.getElementById('selectExam') || document.getElementById('selectExamination');
        const examId = parseInt(examSel.value);
        const className = document.getElementById('selectClass').value;
        const subjectCode = document.getElementById('selectSubject').value;
        
        if (!examId || !className || !subjectCode) { 
            alert('Select examination, class and subject'); 
            return; 
        }

        // 1. Fetch the master list of students for this class profile context
        const { data: baseStudents, error: sErr } = await supabaseClient
            .from('students')
            .select('id, registration_no, roll_no, student_name, father_name')
            .eq('school_code', 'TECHINFO_2026'); // Fetches active school records

        if (sErr) { alert(sErr.message); return; }

        if (!baseStudents || baseStudents.length === 0) {
            document.getElementById('studentListRows').innerHTML = `<tr><td colspan="6">No student profiles found for this school context.</td></tr>`;
            document.getElementById('marksTable').style.display = 'table';
            return;
        }

        // 2. Parallel pull of evaluation records matching target metrics context
        const { data: offlineResults, error: rErr } = await supabaseClient
            .from('result')
            .select('*')
            .eq('exam_id', examId)
            .eq('class', className)
            .eq('subject_code', subjectCode);

        const { data: onlineResults, error: smErr } = await supabaseClient
            .from('student_subject_marks')
            .select('*')
            .eq('exam_id', examId)
            .eq('class', className)
            .eq('subject_code', subjectCode);

        if (rErr || smErr) { 
            console.error("Evaluation tables mapping warnings:", rErr, smErr); 
        }

        const tbody = document.getElementById('studentListRows');
        tbody.innerHTML = '';
        let finalRows = [];

        // 3. Process records relative to base student availability definitions
        baseStudents.forEach(st => {
            const matchOffline = (offlineResults || []).filter(x => x.student_id === st.id);
            const matchOnline = (onlineResults || []).filter(x => x.student_id === st.id);

            // Consolidate rows to ensure absolute deduplication via grouping logic emulation
            const offlineMarks = matchOffline.length > 0 ? Math.max(...matchOffline.map(x => x.marks_obtained ?? 0)) : 0;
            const onlineMarks = matchOnline.length > 0 ? Math.max(...matchOnline.map(x => x.marks_obtained ?? 0)) : null;

            // Extract baseline attributes safely out of array structures
            const marksSet = matchOffline[0]?.marks_set || matchOnline[0]?.marks_set || 100;
            const resultId = matchOffline[0]?.id || matchOnline[0]?.result_id || st.id;

            finalRows.push({
                student: st,
                result_id: resultId,
                marks_set: marksSet,
                offline_marks: offlineMarks,
                online_marks: onlineMarks
            });
        });

        // Sort by Roll Number numerically matching configuration requirements
        finalRows.sort((a, b) => parseInt(a.student.roll_no || 0) - parseInt(b.student.roll_no || 0));

        // 4. Dom Generation Loop
        finalRows.forEach(row => {
            const tr = document.createElement('tr');
            const currentOnlineValue = (row.online_marks !== null && !isNaN(row.online_marks)) ? row.online_marks : "";

            tr.innerHTML = `
                <td>${row.student.registration_no || '-'}</td>
                <td>${row.student.roll_no || '-'}</td>
                <td><strong>${row.student.student_name}</strong></td>
                <td>${row.student.father_name || '-'}</td>
                <td class="offline-text">${row.offline_marks} / ${row.marks_set}</td>
                <td>
                    <input type="number" 
                           class="input-score" 
                           data-result-id="${row.result_id}"
                           data-student-id="${row.student.id}"
                           min="0" 
                           max="${row.marks_set}" 
                           value="${currentOnlineValue}"
                           placeholder="-">
                    <span> / ${row.marks_set}</span>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('marksTable').style.display = 'table';
        if(document.getElementById('actionFooter')) {
            document.getElementById('actionFooter').style.display = 'flex';
        }
    }

    async function saveCloudRows() {
        const inputs = document.querySelectorAll('.input-score');
        const examSel = document.getElementById('selectExam') || document.getElementById('selectExamination');
        const examId = parseInt(examSel.value);
        const className = document.getElementById('selectClass').value;
        const subjectCode = document.getElementById('selectSubject').value;
        const msg = document.getElementById('statusMessage');
        
        if(msg) msg.innerText = '⏳ Syncing changes...';
        let hasError = false;

        for (let input of inputs) {
            if (input.value === "") continue; 
            
            const resId = parseInt(input.dataset.resultId);
            const studId = parseInt(input.dataset.studentId);
            const maxMarks = parseFloat(input.getAttribute('max')) || 100;
            const newMarks = parseFloat(input.value) || 0;

            const { error } = await supabaseClient
                .from('student_subject_marks')
                .upsert({
                    result_id: resId,
                    subject_code: subjectCode,
                    exam_id: examId,
                    student_id: studId,
                    class: className,
                    marks_set: maxMarks,
                    marks_obtained: newMarks
                });

            if (error) { 
                hasError = true; 
                console.error("Upsert tracking error details:", error); 
            }
        }

        if(msg) {
            if (hasError) { 
                msg.className = 'status-msg text-error'; 
                msg.innerText = '❌ Errors encountered while processing records.'; 
            } else { 
                msg.className = 'status-msg text-success'; 
                msg.innerText = '✅ Saved securely!'; 
            }
        }
    }
</script>


</body>
</html>
